<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link id="fontlink" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden}
body{font-family:var(--font),system-ui,sans-serif;color:#fff}
#stage{position:relative;width:1280px;height:720px;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(90px)}
.sc{position:absolute;inset:0;opacity:0;visibility:hidden}
.c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.pill{display:inline-block;background:#fff;color:var(--pillc);font-weight:800;font-size:46px;letter-spacing:-.5px;padding:14px 46px;border-radius:999px;box-shadow:0 18px 40px -18px rgba(20,10,90,.6)}
.tit{font-weight:800;font-size:66px;letter-spacing:-2px;line-height:1.05;text-shadow:0 8px 30px rgba(20,10,90,.35);white-space:nowrap;text-align:center}
.tit span{display:inline-block;margin:0 .13em}
.passo{text-align:center;width:1240px}
.passo .pill{margin-bottom:26px}
.card{position:absolute;width:190px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 24px 50px -24px rgba(10,5,60,.65);color:#1B2238}
.card-top{display:flex;align-items:center;gap:7px;padding:8px 10px;font-size:11px;line-height:1.15}
.card-top b{display:block;font-size:11.5px}.card-top small{color:#6B7280;font-size:10px}
.av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--pri),#7FA0FF);flex:none}
.card-img{position:relative;overflow:hidden;background:#ddd}
.card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.arte{position:absolute;left:0;right:0;bottom:0;padding:34px 10px 10px;background:linear-gradient(180deg,rgba(3,22,63,0),rgba(3,22,63,.9));color:#fff}
.arte b{display:block;font-size:15px;line-height:1.12;font-weight:800}
.faixa{display:inline-block;background:#FFD43B;color:#1B2238;font-size:9.5px;font-weight:800;padding:3px 7px;border-radius:5px;margin:0 0 5px}
.cta{display:flex;align-items:center;gap:6px;padding:9px 10px;font-size:11.5px;font-weight:800;color:var(--pri);border-top:1px solid #E5E7EB}
.cta svg{width:14px;height:14px;color:#25D366}
.phone{position:absolute;width:300px;height:600px;border-radius:44px;background:#0B1023;padding:12px;box-shadow:0 40px 80px -30px rgba(10,5,60,.75)}
.screen{position:relative;width:100%;height:100%;border-radius:33px;overflow:hidden;background:#E9EEF7}
.notch{position:absolute;left:50%;top:10px;width:90px;height:24px;border-radius:14px;background:#0B1023;transform:translateX(-50%);z-index:9}
.map{position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 46px,#fff 46px 56px,transparent 56px) 0 0/112px 100%,linear-gradient(0deg,transparent 0 46px,#fff 46px 56px,transparent 56px) 0 0/100% 104px,#DCE5F2}
.park{position:absolute;background:#C9EBCF;border-radius:10px}
.raio{position:absolute;border-radius:50%;background:rgba(0,66,255,.13);border:3px solid var(--pri);transform:translate(-50%,-50%)}
.voce{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--pri);border:4px solid #fff;box-shadow:0 4px 12px rgba(0,30,120,.45);transform:translate(-50%,-50%);z-index:3}
.dot{position:absolute;width:16px;height:16px;border-radius:50%;border:3px solid #fff;background:#9AA3B5;transform:translate(-50%,-50%);box-shadow:0 3px 8px rgba(0,0,0,.25);z-index:2}
.dot i{position:absolute;left:50%;bottom:130%;font-style:normal;font-size:20px;transform:translateX(-50%);opacity:0}
.chip{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);background:#fff;color:#0B1023;font-weight:800;font-size:14px;padding:9px 16px;border-radius:999px;white-space:nowrap;box-shadow:0 8px 20px -8px rgba(0,0,0,.35);z-index:8}
.bar{position:absolute;left:14px;right:14px;top:46px;height:40px;border-radius:12px;background:#fff;box-shadow:0 6px 16px -8px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px;padding:0 12px;z-index:4}
.bar span{height:10px;border-radius:6px;background:#D6DBE6}
.wa-head{position:absolute;left:0;right:0;top:0;height:92px;background:#075E54;display:flex;align-items:flex-end;gap:10px;padding:0 16px 14px}
.wa-head .av{width:38px;height:38px}
.wa-head .bars span{display:block;height:10px;border-radius:6px;background:rgba(255,255,255,.85);margin:4px 0}
.wa-body{position:absolute;left:0;right:0;top:92px;bottom:0;background:#ECE5DD}
.bub{position:absolute;left:14px;background:#fff;border-radius:4px 16px 16px 16px;padding:12px 14px;box-shadow:0 2px 3px rgba(0,0,0,.12)}
.bub span{display:block;height:9px;border-radius:5px;background:#CDD3DC;margin:5px 0}
.bub.me{left:auto;right:14px;background:#D9FDD3;border-radius:16px 4px 16px 16px}
.bub.me span{background:#A9DCA1}
.count{position:absolute;right:-14px;top:-14px;min-width:44px;height:44px;border-radius:22px;background:#EF2B2D;color:#fff;font-weight:800;font-size:22px;display:grid;place-items:center;padding:0 10px;border:4px solid #fff;z-index:10}
.slide{position:absolute;inset:0}
.slide img{width:100%;height:100%;object-fit:cover}
.ok{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:#16A34A;display:grid;place-items:center;font-size:62px;font-weight:900;color:#fff;box-shadow:0 20px 40px -10px rgba(22,163,74,.7);z-index:8}
.ig-top{position:absolute;left:0;right:0;top:40px;display:flex;align-items:center;gap:8px;padding:0 14px;z-index:4}
.ig-top .av{width:30px;height:30px;border:2px solid #fff}
.ig-top span{height:9px;width:90px;border-radius:5px;background:rgba(255,255,255,.9)}
.heart{position:absolute;font-size:30px;z-index:6}
.arrow{position:absolute}
.cursor{position:absolute;width:62px;height:62px;z-index:50;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.row{position:absolute;display:flex;align-items:center;gap:18px}
.row .a{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.16);flex:none}
.row .b{height:44px;border-radius:14px;background:rgba(255,255,255,.12)}
.badge{position:absolute;left:50%;top:150px;display:flex;align-items:center;gap:12px;background:#EF2B2D;color:#fff;font-weight:800;font-size:46px;padding:14px 28px;border-radius:22px;box-shadow:0 18px 30px -14px rgba(120,0,0,.6)}
.badge:after{content:"";position:absolute;left:50%;bottom:-16px;margin-left:-16px;border:16px solid transparent;border-bottom:0;border-top-color:#EF2B2D}
.badge svg{width:42px;height:42px}
.fly{position:absolute;width:46px;height:46px;border-radius:50%;background:rgba(239,43,45,.9);display:grid;place-items:center;box-shadow:0 6px 14px rgba(120,0,0,.35)}
.fly svg{width:24px;height:24px;color:#fff}
.logo-card{background:#fff;border-radius:28px;padding:28px 46px;box-shadow:0 30px 60px -24px rgba(10,5,60,.6)}
.logo-card img{display:block;height:120px}
.logo-txt{color:var(--pillc);font-weight:800;font-size:64px;letter-spacing:-2px;white-space:nowrap}
</style></head>
<body><div id="stage"></div>
<svg id="cursor" class="cursor" viewBox="0 0 64 64" style="display:none"><path d="M10 6l44 22-20 6-6 20z" fill="#000" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg>
<script>
const CFG = /*CFG*/{};
const ICON = {
 whatsapp:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>',
 seguidores:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5C21 16.5 17 14 12 14z"/></svg>',
 coracao:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2 0 3.4 1.1 4.4 2.5 1-1.4 2.4-2.5 4.4-2.5 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg>',
 vendas:'<svg viewBox="0 0 24 24"><text x="12" y="18" text-anchor="middle" font-size="18" font-weight="900" fill="currentColor" font-family="sans-serif">$</text></svg>'
};
const C = Object.assign({pri:"#0042FF",pill:"#2D2BE8",base:"#3A1FE0",blobs:["#B15CFF","#1E3BFF","#7B3CF0","#4A2BFF"]}, CFG.cores||{});
const FONT = CFG.fonte || "Plus Jakarta Sans";
document.getElementById('fontlink').href = "https://fonts.googleapis.com/css2?family="+FONT.replace(/ /g,"+")+":wght@600;700;800&display=swap";
document.documentElement.style.setProperty('--font','"'+FONT+'"');
document.documentElement.style.setProperty('--pri',C.pri);
document.documentElement.style.setProperty('--pillc',C.pill);

const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const stage=document.getElementById('stage');stage.style.background=C.base;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), seg=(t,a,b)=>cl((t-a)/(b-a)), eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, back=x=>{const c=1.7;return x<=0?0:1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}, lerp=(a,b,p)=>a+(b-a)*p;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function words(el){el.innerHTML=el.textContent.split(' ').map(w=>`<span>${esc(w)}</span>`).join(' ');return [...el.children]}
function animWords(ws,t,a,step=.11){ws.forEach((w,i)=>{const p=eo(seg(t,a+i*step,a+i*step+.5));w.style.opacity=p;w.style.transform=`translateY(${(1-p)*34}px)`;w.style.filter=`blur(${(1-p)*8}px)`})}
function pop(el,t,a,d=.45,base=''){const p=seg(t,a,a+d);el.style.transform=`${base} scale(${Math.max(0,back(p))})`;el.style.opacity=cl(p*3)}
function scene(el,t,a,b,d=.45){const pi=eo(seg(t,a,a+d)),po=seg(t,b-d,b);const o=(t<a||t>b)?0:pi*(1-po);el.style.opacity=o;el.style.filter=`blur(${(1-pi)*16+po*18}px)`;el.style.visibility=o>0?'visible':'hidden';return o>0}
const cur=document.getElementById('cursor');let curOn=false;
function cursor(x,y,o,s=1){curOn=true;cur.style.display='block';cur.style.left=x+'px';cur.style.top=y+'px';cur.style.opacity=o;cur.style.transform=`scale(${s})`}
function card(it,w,prop){const top=it.estilo==='anuncio'?`<div class="card-top"><span class="av"></span><span><b>${esc(it.perfil||'seunegocio')}</b><small>Patrocinado</small></span></div>`:'';
 const arte=(it.faixa||it.titulo)?`<div class="arte">${it.faixa?`<span class="faixa">${esc(it.faixa)}</span>`:''}${it.titulo?`<b>${esc(it.titulo)}</b>`:''}</div>`:'';
 const cta=it.estilo==='anuncio'?`<div class="cta">${ICON.whatsapp}${esc(it.cta||'Enviar mensagem')}</div>`:'';
 const d=$(`<div class="card" style="width:${w}px">${top}<div class="card-img" style="aspect-ratio:${prop||'4/5'}"><img src="${esc(it.imagem)}">${arte}</div>${cta}</div>`);return d}

// fundo
const blobs=C.blobs.map((c,i)=>{const b=$(`<div class="blob" style="width:${[760,820,620,540][i%4]}px;height:${[760,820,620,540][i%4]}px;background:${c}"></div>`);stage.appendChild(b);return b});
function drawBg(t){const P=[[-120,-260,120,80,.35,.3],[-250,260,90,70,.25,.33],[820,-200,110,90,.28,.22],[760,330,100,90,.31,.27]];
 blobs.forEach((b,i)=>{const p=P[i%4];b.style.transform=`translate(${p[0]+Math.sin(t*p[4]+i)*p[2]}px,${p[1]+Math.cos(t*p[5]+i)*p[3]}px)`})}

// ===== demos =====
const DEMOS={
 galeria(cfg){const el=$('<div class="sc"></div>');const its=(cfg.itens||[]).slice(0,8);const prop=cfg.proporcao||'4/5';
  const W=prop==='9/16'?150:(its.length<=4?230:190), GX=[155,415,675,935].map(x=>x+(190-W)/2);const cardsH=[];
  its.forEach(it=>{const c=card(Object.assign({estilo:cfg.estilo},it),W,prop);el.appendChild(c);cardsH.push(c)});
  const pick=cfg.escolhido||0;
  return {el,dur:4.7,render(t){const rowH=cardsH[0]?cardsH[0].offsetHeight:300;const GY=cardsH.length<=4?[(720-rowH)/2]:[(720-2*rowH-30)/2,(720-2*rowH-30)/2+rowH+30];
   const pe=eio(seg(t,3.0,3.8));
   cardsH.forEach((c,i)=>{const col=i%4,row=Math.floor(i/4),p=eo(seg(t,.1+i*.07,.7+i*.07));let x=GX[col],y=GY[row]+(1-p)*420,s=1,o=p;
    if(i===pick){const S=Math.min(1.42,560/rowH);x=lerp(x,640-W*S/2,pe);y=lerp(y,360-rowH*S/2,pe);s=lerp(1,S,pe);s*=1-Math.sin(seg(t,2.65,2.9)*Math.PI)*.07}
    else{o*=1-seg(t,3.0,3.4);s=1-seg(t,3.0,3.4)*.1}
    c.style.left=x+'px';c.style.top=y+'px';c.style.opacity=o;c.style.transform=`scale(${s})`;c.style.transformOrigin='top left';c.style.zIndex=i===pick?5:1;
    c.style.boxShadow=i===pick&&t>2.6?`0 0 0 ${4*seg(t,2.6,2.8)}px #FFD43B,0 30px 60px -24px rgba(10,5,60,.7)`:''});
   const col=pick%4,row=Math.floor(pick/4);const tx=GX[col]+W*.55,ty=GY[row]+rowH*.45;
   const ci=eo(seg(t,1.5,2.5)),co=seg(t,1.4,1.6)*(1-seg(t,3.1,3.4));if(co>0)cursor(lerp(1150,tx,ci),lerp(700,ty,ci),co,1-Math.sin(seg(t,2.6,2.85)*Math.PI)*.18)}}},

 mapa(cfg){const el=$(`<div class="sc"><div class="phone" style="left:490px;top:60px"><div class="screen"><div class="notch"></div><div class="map"><div class="park" style="left:120px;top:400px;width:90px;height:60px"></div><div class="park" style="left:10px;top:120px;width:60px;height:80px"></div><div class="raio"></div><div class="voce"></div></div><div class="bar"><span style="width:18px;height:18px;border-radius:50%;background:var(--pri)"></span><span style="width:120px"></span><span style="width:40px"></span></div>${cfg.etiqueta?`<div class="chip">${esc(cfg.etiqueta)}</div>`:''}</div></div></div>`);
  const ph=el.querySelector('.phone'),map=el.querySelector('.map'),raio=el.querySelector('.raio'),voce=el.querySelector('.voce'),chip=el.querySelector('.chip');
  const CX=138,CY=288,R=135;[raio,voce].forEach(e=>{e.style.left=CX+'px';e.style.top=CY+'px'});
  const DP=[[60,150],[210,170],[95,240],[200,250],[150,200],[60,330],[230,330],[110,380],[195,400],[35,450],[245,470],[140,120],[250,90],[30,560],[150,520],[260,560],[80,500],[175,310]];
  const dots=DP.map(p=>{const d=$(`<div class="dot" style="left:${p[0]}px;top:${p[1]}px"><i>${esc(cfg.icone||'💬')}</i></div>`);map.appendChild(d);return {el:d,dist:Math.hypot(p[0]-CX,p[1]-CY)}});
  const inside=dots.filter(d=>d.dist<R-10).sort((a,b)=>a.dist-b.dist);
  return {el,dur:5.0,render(t){ph.style.transform=`translateY(${(1-eo(seg(t,0,.7)))*120}px)`;pop(voce,t,.5,.4,'translate(-50%,-50%)');
   const rp=eo(seg(t,.9,1.9));raio.style.width=raio.style.height=R*2*rp+'px';raio.style.opacity=rp>0?1:0;
   dots.forEach(d=>{d.el.style.background='#9AA3B5';d.el.style.transform='translate(-50%,-50%)';d.el.firstChild.style.opacity=0});
   inside.forEach((d,i)=>{const a=2.0+i*.22,p=seg(t,a,a+.3);if(p>0){d.el.style.background='#25D366';d.el.style.transform=`translate(-50%,-50%) scale(${1+Math.sin(p*Math.PI)*.5})`;const m=seg(t,a+.1,a+.5),ic=d.el.firstChild;ic.style.opacity=m;ic.style.transform=`translateX(-50%) translateY(${(1-eo(m))*10}px) scale(${back(m)})`}});
   if(chip)pop(chip,t,1.6,.45,'translateX(-50%)')}}},

 conversa(cfg){const esq=cfg.esquerda||{};const el=$(`<div class="sc"><svg class="arrow" width="150" height="120" viewBox="0 0 150 120" style="left:565px;top:300px"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#C9CCE0"/></linearGradient></defs><path d="M8 42h78V10l56 50-56 50V78H8z" fill="url(#ag)" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg>
   <div class="phone" style="left:820px;top:60px"><div class="screen"><div class="notch"></div><div class="wa-head"><span class="av"></span><div class="bars"><span style="width:110px"></span><span style="width:60px;opacity:.6"></span></div></div><div class="wa-body"></div></div><div class="count">0</div></div></div>`);
  const left=card(Object.assign({estilo:'anuncio'},esq),250,esq.proporcao);left.style.left='190px';left.style.top='110px';el.appendChild(left);
  const arr=el.querySelector('.arrow'),ph=el.querySelector('.phone'),wab=el.querySelector('.wa-body'),cnt=el.querySelector('.count');
  const B=[[18,[150,110]],[96,[170,90,120]],[194,[120]],[250,[160,130]],[338,[140,80]]].map((b,i)=>{const d=$(`<div class="bub${i==2?' me':''}" style="top:${b[0]}px">${b[1].map(w=>`<span style="width:${w}px"></span>`).join('')}</div>`);wab.appendChild(d);return d});
  const ctaEl=left.querySelector('.cta');
  return {el,dur:6.0,render(t){const a=eo(seg(t,.05,.7));left.style.transform=`translateX(${(1-a)*-380}px) rotate(${-3*a}deg)`;left.style.opacity=a;
   const ar=seg(t,.6,1.1);arr.style.opacity=ar;arr.style.transform=`translateX(${(1-eo(ar))*-40}px) scale(${.6+.4*back(ar)})`;
   const p=eo(seg(t,.9,1.6));ph.style.transform=`translateX(${(1-p)*380}px)`;ph.style.opacity=p;
   const tx=left.offsetLeft+left.offsetWidth*.55,ty=left.offsetTop+left.offsetHeight-24;
   const ci=eo(seg(t,1.4,2.2)),co=seg(t,1.3,1.5)*(1-seg(t,2.8,3.1));if(co>0)cursor(lerp(620,tx,ci),lerp(650,ty,ci),co,1-Math.sin(seg(t,2.25,2.5)*Math.PI)*.18);
   if(ctaEl)ctaEl.style.background=seg(t,2.25,2.5)>0&&t<3.0?'#E9FBEF':'#fff';
   let n=0;B.forEach((b,i)=>{const s=2.6+i*.6,q=seg(t,s,s+.35);b.style.opacity=q;b.style.transform=`translateY(${(1-eo(q))*16}px) scale(${.9+.1*eo(q)})`;if(q>0&&i!=2)n++});
   cnt.textContent=n;cnt.style.transform=`scale(${n?1+Math.sin(seg((t-2.6)%.6,0,.3)*Math.PI)*.15:0})`}}},

 celular(cfg){const telas=(cfg.telas||[]).slice(0,3);const el=$(`<div class="sc"><div class="phone" style="left:490px;top:60px"><div class="screen" style="background:#fff"><div class="notch"></div>${telas.map(s=>`<div class="slide"><img src="${esc(s)}"></div>`).join('')}<div class="ok">✓</div>${cfg.etiqueta?`<div class="chip">${esc(cfg.etiqueta)}</div>`:''}</div></div></div>`);
  const ph=el.querySelector('.phone'),sl=[...el.querySelectorAll('.slide')],ok=el.querySelector('.ok'),chip=el.querySelector('.chip');
  return {el,dur:5.0,render(t){ph.style.transform=`translateY(${(1-eo(seg(t,0,.7)))*120}px)`;
   const k1=eio(seg(t,1.9,2.4)),k2=eio(seg(t,3.0,3.5));sl.forEach((s,i)=>{const pos=i-(sl.length>1?k1:0)-(sl.length>2?k2:0);s.style.transform=`translateX(${pos*100}%)`});
   const ci=eo(seg(t,1.0,1.7)),co=seg(t,.9,1.1)*(1-seg(t,3.6,3.9));if(co>0)cursor(lerp(900,650,ci),lerp(680,470,ci),co,1-Math.max(Math.sin(seg(t,1.75,1.95)*Math.PI),Math.sin(seg(t,2.85,3.05)*Math.PI))*.18);
   pop(ok,t,3.9,.45);if(chip)pop(chip,t,4.1,.45,'translateX(-50%)')}}},

 instagram(cfg){const el=$(`<div class="sc"><div class="phone" style="left:490px;top:60px"><div class="screen"><div class="notch"></div><div class="slide"><img src="${esc(cfg.imagem)}"></div><div class="ig-top"><span class="av"></span><span></span></div>${cfg.etiqueta?`<div class="chip">${esc(cfg.etiqueta)}</div>`:''}</div><div class="count">0</div></div></div>`);
  const ph=el.querySelector('.phone'),cnt=el.querySelector('.count'),chip=el.querySelector('.chip'),scr=el.querySelector('.screen');
  const H=[...Array(9)].map((_,i)=>{const h=$(`<div class="heart">${esc(cfg.icone||'❤️')}</div>`);scr.appendChild(h);return h});const fim=cfg.ate||128;
  return {el,dur:5.0,render(t){ph.style.transform=`translateY(${(1-eo(seg(t,0,.7)))*120}px)`;
   H.forEach((h,i)=>{const s=1.0+i*.38,q=seg(t,s,s+1.6);h.style.left=(200+Math.sin(i*1.9+t*3)*24)+'px';h.style.top=(520-q*380)+'px';h.style.opacity=q>0&&q<1?Math.sin(q*Math.PI):0;h.style.transform=`scale(${.8+.4*Math.abs(Math.sin(i))})`});
   const n=Math.round(fim*eio(seg(t,1.0,4.4)));cnt.textContent=n;cnt.style.transform=`scale(${n?1:0})`;if(chip)pop(chip,t,1.4,.45,'translateX(-50%)')}}}
};

// ===== montar linha do tempo =====
const TL=[];let T=0;const TIT=2.8;
(CFG.passos||[]).forEach((p,i)=>{
 const s=$(`<div class="sc"><div class="c passo"><div class="pill">PASSO ${i+1}</div><div class="tit">${esc(p.titulo)}</div></div></div>`);stage.appendChild(s);
 const ws=words(s.querySelector('.tit'));const pill=s.querySelector('.pill');const a=T;
 TL.push({a,b:a+TIT,f:t=>{if(scene(s,t,a,a+TIT)){pop(pill,t,a+.05,.5);animWords(ws,t,a+.35)}}});T+=TIT;
 const d=(DEMOS[(p.demo||{}).tipo]||DEMOS.galeria)(p.demo||{});stage.appendChild(d.el);const b=T,dur=d.dur+.4;
 TL.push({a:b,b:b+dur,f:t=>{if(scene(d.el,t,b,b+dur))d.render(t-b)}});T+=dur});
const F=CFG.fechamento||{};
if(F.titulo){const s=$(`<div class="sc"><div class="c tit">${esc(F.titulo)}</div></div>`);stage.appendChild(s);const ws=words(s.firstChild);const a=T;TL.push({a,b:a+2.2,f:t=>{if(scene(s,t,a,a+2.2))animWords(ws,t,a+.1,.18)}});T+=2.2}
if((F.frases||[]).length){const ic=ICON[(F.contador||{}).icone||'whatsapp']||ICON.whatsapp;
 const s=$(`<div class="sc"><div class="rows"></div><div class="flys"></div><div class="badge">${ic}<span>0</span></div></div>`);stage.appendChild(s);
 const rows=[...Array(7)].map((_,i)=>{const r=$(`<div class="row"><div class="a"></div><div class="b" style="width:${[260,380,300,420,240,360,310][i]}px;height:${i%3==1?96:44}px"></div></div>`);r.style.left=(150+(i%2)*60)+'px';s.firstChild.appendChild(r);return r});
 const flys=[...Array(9)].map(()=>{const f=$(`<div class="fly">${ic}</div>`);s.children[1].appendChild(f);return f});
 const fr=F.frases.map(x=>{const e=$(`<div class="c tit" style="top:56%">${esc(x)}</div>`);s.appendChild(e);return {e,ws:words(e)}});
 const badge=s.querySelector('.badge'),bn=badge.querySelector('span');const a=T,per=1.4,dur=per*fr.length+.8;const de=(F.contador||{}).de||3,ate=(F.contador||{}).ate||45;
 TL.push({a,b:a+dur,f:t=>{if(!scene(s,t,a,a+dur))return;const L=t-a;
  rows.forEach((r,i)=>{r.style.top=(((i*118-L*38)%826+826)%826-110)+'px';r.style.opacity=.9});
  flys.forEach((f,i)=>{const q=seg(L,.2+i*.42,2.8+i*.42);f.style.left=(1110+Math.sin(i*1.7+t*2)*40)+'px';f.style.top=(740-q*820)+'px';f.style.opacity=q>0&&q<1?Math.sin(q*Math.PI):0;f.style.transform=`scale(${.9+.3*Math.abs(Math.sin(i*1.3))})`});
  fr.forEach((x,i)=>{const s0=.1+i*per,s1=i==fr.length-1?dur:s0+per;const v=L>=s0&&L<s1;x.e.style.visibility=v?'visible':'hidden';if(v){animWords(x.ws,L,s0,.1);const o=i==fr.length-1?1:1-seg(L,s1-.25,s1);x.e.style.opacity=o;x.e.style.filter=`blur(${(1-o)*10}px)`}});
  if(F.contador!==false){pop(badge,L,.1+per,.5,'translateX(-50%)');bn.textContent=Math.round(lerp(de,ate,eio(seg(L,.4+per,dur-.6))))}else badge.style.display='none'}});T+=dur}
if(CFG.logo||CFG.marca){const s=$(`<div class="sc"><div class="c"><div class="logo-card">${CFG.logo?`<img src="${esc(CFG.logo)}">`:`<div class="logo-txt">${esc(CFG.marca)}</div>`}</div></div></div>`);stage.appendChild(s);const lc=s.querySelector('.logo-card');const a=T;TL.push({a,b:a+2.4,f:t=>{if(scene(s,t,a,a+3.5))pop(lc,t,a+.05,.55)}});T+=2.0}
window.DUR=Math.round(T*10)/10;
window.render=function(t){curOn=false;drawBg(t);TL.forEach(x=>x.f(t));if(!curOn)cur.style.display='none'};
render(0);
</script></body></html>
